# Builds, tests and format-checks every pull request. Vercel skips Dependabot
# branches (.scripts/should_deploy.sh), so this is their only build check.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Checks only the files the PR changes, because main still has unformatted
  # files. Runs per package so that package's .prettierignore applies.
  format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
        shell: bash # adds pipefail, so a failed git diff fails the step instead of checking nothing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # HEAD is GitHub's PR merge commit; HEAD^ is the base branch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --ignore-scripts # prettier needs no install scripts
      - name: Check formatting of changed files
        run: git diff -z --name-only --relative --diff-filter=d HEAD^ HEAD | xargs -0r npx prettier --check --ignore-unknown
